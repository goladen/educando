<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Logo de VaniLa: fichas V y L en neón (mismos colores que el juego) -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1b5e"/>
      <stop offset="1" stop-color="#0A0918"/>
    </linearGradient>
    <linearGradient id="fichaV" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="0.75" stop-color="#14122d"/>
    </linearGradient>
    <linearGradient id="fichaL" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="0.75" stop-color="#14122d"/>
    </linearGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#fondo)"/>
  <!-- V -->
  <g transform="rotate(-6 64 100)">
    <rect x="22" y="50" width="84" height="96" rx="18" fill="#A78BFA" opacity="0.35" transform="translate(0 7)"/>
    <rect x="22" y="50" width="84" height="96" rx="18" fill="url(#fichaV)" stroke="#A78BFA" stroke-width="5" filter="url(#brillo)"/>
    <text x="64" y="125" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="66" fill="#ffffff" filter="url(#brillo)">V</text>
  </g>
  <!-- L -->
  <g transform="rotate(6 136 100)">
    <rect x="94" y="54" width="84" height="96" rx="18" fill="#22D3EE" opacity="0.35" transform="translate(0 7)"/>
    <rect x="94" y="54" width="84" height="96" rx="18" fill="url(#fichaL)" stroke="#22D3EE" stroke-width="5" filter="url(#brillo)"/>
    <text x="136" y="129" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="66" fill="#ffffff" filter="url(#brillo)">L</text>
  </g>
</svg>
