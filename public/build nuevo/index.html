<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Mansión Pitagórica</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0d0221; overflow: hidden; }
      #unityContainer { width: 100vw; height: 100dvh; }
      #unityContainer canvas { width: 100% !important; height: 100% !important; }
    </style>
    <script src="Build/UnityLoader.js"></script>
    <script>
      var unityInstance = null;

      // Guardamos las preguntas aquí en cuanto React las envía
      // PreguntasManager.Start() las recoge llamando a MansionListo()
      var preguntasGuardadas = null;

      // MOBILE: preguntas guardadas en sessionStorage por React antes de navegar aquí
      (function() {
        var stored = sessionStorage.getItem('mansionPreguntas');
        if (stored) {
          preguntasGuardadas = stored;
          sessionStorage.removeItem('mansionPreguntas');
          console.log('[Mansion] Preguntas cargadas desde sessionStorage (mobile)');
        }
      })();

      function enviarAUnity(payload) {
        try {
          unityInstance.SendMessage('PreguntasManager', 'CargarPreguntasDesdeWeb', payload);
          console.log('[Mansion] Preguntas enviadas a PreguntasManager');
        } catch(err) {
          console.warn('[Mansion] SendMessage error:', err);
        }
      }

      // ── Llamado desde PreguntasManager.Start() via Application.ExternalCall("MansionListo") ──
      // Este es el momento correcto: PreguntasManager ya existe en la escena
      function MansionListo() {
        console.log('[Mansion] PreguntasManager listo — enviando preguntas');
        window.parent.postMessage({ type: 'MANSION_LISTO' }, '*');

        // Si React ya había enviado las preguntas, enviarlas ahora
        if (preguntasGuardadas) {
          enviarAUnity(preguntasGuardadas);
        }
      }

      // ── Llamado desde Unity cuando termina la partida ──
      // Application.ExternalCall("MansionResultado", jsonString)
      function MansionResultado(jsonString) {
        try {
          var data = JSON.parse(jsonString);
          if (window.self === window.top) {
            // Mobile full-page mode: guardar resultado y volver a React
            sessionStorage.setItem('mansionResultado', jsonString);
            window.history.back();
          } else {
            // Desktop iframe mode: enviar al padre
            window.parent.postMessage({ type: 'MANSION_RESULTADO', data: data }, '*');
          }
        } catch(e) { console.error('[Mansion] MansionResultado parse error:', e); }
      }

      // ── Mensajes desde React padre ───────────────────────────────────────────
      window.addEventListener('message', function(e) {
        if (e.data === 'UNITY_QUIT') {
          try { if (unityInstance && unityInstance.Quit) unityInstance.Quit(); } catch(_) {}
          return;
        }
        if (e.data && e.data.type === 'MANSION_PREGUNTAS') {
          var arr = e.data.preguntas || [];
          console.log('[Mansion] Preguntas recibidas de React (' + arr.length + ')');
          if (arr.length > 0) {
            preguntasGuardadas = JSON.stringify({ arrayPreguntas: arr });
            if (unityInstance) {
              enviarAUnity(preguntasGuardadas);
            }
          }
        }
      });

      // ── Inicializar Unity (API 2019.x — NO devuelve Promise) ─────────────────
      unityInstance = UnityLoader.instantiate('unityContainer', 'Build/build nuevo.json', {
        onProgress: function(gameInstance, progress) {
          if (progress === 1) {
            unityInstance = gameInstance;
            console.log('[Mansion] Unity cargado. Esperando MansionListo() desde C#...');
          }
        }
      });
    </script>
  </head>
  <body>
    <div id="unityContainer"></div>
    <div id="mobileUI" style="display:none;">
      <button id="backBtn" onclick="window.history.back()" style="position:fixed;top:12px;left:12px;z-index:9999;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,0.7);border:1.5px solid rgba(255,255,255,0.3);color:white;font-size:1.1rem;cursor:pointer;">⬅</button>
      <button id="fsBtn" onclick="toggleFS()" style="position:fixed;top:12px;right:12px;z-index:9999;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,0.7);border:1.5px solid rgba(255,255,255,0.3);color:white;font-size:1.1rem;cursor:pointer;">⤢</button>
    </div>
    <script>
      function toggleFS() {
        var btn = document.getElementById('fsBtn');
        var el = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          if (el.requestFullscreen) el.requestFullscreen();
          else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
          btn.textContent = '⛶';
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          btn.textContent = '⤢';
        }
      }
      document.addEventListener('fullscreenchange', function() {
        document.getElementById('fsBtn').textContent =
          document.fullscreenElement ? '⛶' : '⤢';
      });
      document.addEventListener('webkitfullscreenchange', function() {
        document.getElementById('fsBtn').textContent =
          document.webkitFullscreenElement ? '⛶' : '⤢';
      });
      if (window.self === window.top) {
        document.getElementById('mobileUI').style.display = 'block';
      }
    </script>
  </body>
</html>
