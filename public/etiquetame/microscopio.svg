<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f8c8d"/>
      <stop offset="0.5" stop-color="#d5dbdb"/>
      <stop offset="1" stop-color="#7f8c8d"/>
    </linearGradient>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f7"/>
      <stop offset="1" stop-color="#cfd8dc"/>
    </linearGradient>
    <radialGradient id="luz" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffde7"/>
      <stop offset="0.6" stop-color="#ffee58"/>
      <stop offset="1" stop-color="#fbc02d"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="700" fill="#f6f9fc"/>
  <ellipse cx="510" cy="662" rx="240" ry="12" fill="#000" opacity="0.1"/>

  <!-- Base -->
  <rect x="300" y="600" width="420" height="52" rx="18" fill="#37474f" stroke="#263238" stroke-width="3"/>
  <rect x="312" y="606" width="396" height="10" rx="5" fill="#546e7a"/>

  <!-- Brazo -->
  <path d="M400 612 L400 330 Q400 240 475 212" fill="none" stroke="#263238" stroke-width="52" stroke-linecap="round"/>
  <path d="M400 612 L400 330 Q400 240 475 212" fill="none" stroke="url(#cuerpo)" stroke-width="44" stroke-linecap="round"/>

  <!-- Foco / fuente de luz -->
  <rect x="535" y="565" width="50" height="36" rx="5" fill="#455a64" stroke="#263238" stroke-width="2.5"/>
  <ellipse cx="560" cy="565" rx="24" ry="8" fill="url(#luz)" stroke="#f9a825" stroke-width="2"/>
  <path d="M545 556 L540 520 M560 553 L560 515 M575 556 L580 520" stroke="#fdd835" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Condensador bajo la platina -->
  <rect x="540" y="462" width="40" height="26" rx="4" fill="#78909c" stroke="#455a64" stroke-width="2"/>

  <!-- Platina -->
  <rect x="400" y="440" width="320" height="22" rx="4" fill="#263238"/>
  <rect x="548" y="440" width="24" height="5" fill="#90a4ae"/>
  <!-- Portaobjetos -->
  <rect x="520" y="433" width="90" height="7" fill="#b3e5fc" stroke="#4fc3f7" stroke-width="1.5"/>
  <!-- Pinzas -->
  <path d="M600 436 L668 428" stroke="url(#metal)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="666" cy="434" r="6" fill="#90a4ae" stroke="#455a64" stroke-width="2"/>
  <path d="M470 431 L512 436" stroke="url(#metal)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="470" cy="435" r="6" fill="#90a4ae" stroke="#455a64" stroke-width="2"/>

  <!-- Tornillos macrométrico (grande) y micrométrico (pequeño), uno encima del otro -->
  <circle cx="400" cy="500" r="42" fill="#455a64" stroke="#263238" stroke-width="3"/>
  <circle cx="400" cy="500" r="42" fill="none" stroke="#78909c" stroke-width="5" stroke-dasharray="6 6"/>
  <circle cx="400" cy="566" r="21" fill="#90a4ae" stroke="#263238" stroke-width="3"/>
  <circle cx="400" cy="566" r="21" fill="none" stroke="#cfd8dc" stroke-width="3" stroke-dasharray="3 4"/>
  <circle cx="400" cy="500" r="12" fill="#263238"/>

  <!-- Cabezal -->
  <path d="M455 190 L625 190 Q640 190 640 205 L640 225 Q640 240 625 240 L470 240 Z" fill="url(#cuerpo)" stroke="#263238" stroke-width="3"/>

  <!-- Tubo inclinado + ocular -->
  <line x1="500" y1="200" x2="425" y2="110" stroke="#263238" stroke-width="40" stroke-linecap="round"/>
  <line x1="500" y1="200" x2="425" y2="110" stroke="url(#cuerpo)" stroke-width="32" stroke-linecap="round"/>
  <line x1="425" y1="110" x2="398" y2="76" stroke="#263238" stroke-width="30"/>
  <line x1="425" y1="110" x2="398" y2="76" stroke="#546e7a" stroke-width="22"/>
  <ellipse cx="396" cy="73" rx="17" ry="7" fill="#212121" transform="rotate(-38 396 73)"/>

  <!-- Revólver -->
  <path d="M515 240 L605 240 L590 272 L530 272 Z" fill="#546e7a" stroke="#263238" stroke-width="3" stroke-linejoin="round"/>

  <!-- Objetivos -->
  <g stroke="#263238" stroke-width="2.5">
    <rect x="547" y="270" width="26" height="72" rx="4" fill="url(#metal)"/>
    <rect x="551" y="330" width="18" height="16" rx="3" fill="#37474f"/>
    <rect x="516" y="266" width="22" height="52" rx="4" fill="url(#metal)" transform="rotate(22 527 266)"/>
    <rect x="582" y="266" width="22" height="58" rx="4" fill="url(#metal)" transform="rotate(-22 593 266)"/>
  </g>
  <rect x="549" y="300" width="22" height="5" fill="#e53935"/>
</svg>
