<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d8f5"/>
      <stop offset="1" stop-color="#eaf6fd"/>
    </linearGradient>
    <linearGradient id="lava" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c0261b"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <radialGradient id="camara" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.45" stop-color="#f0521e"/>
      <stop offset="1" stop-color="#9e1b12"/>
    </radialGradient>
    <radialGradient id="crater" cx="50%" cy="20%" r="80%">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#e2401c"/>
    </radialGradient>
  </defs>

  <!-- Cielo -->
  <rect width="1000" height="470" fill="url(#cielo)"/>

  <!-- Subsuelo en estratos -->
  <rect y="470" width="1000" height="230" fill="#a1887f"/>
  <path d="M0 520 C200 510 350 530 500 522 C650 514 800 532 1000 520 L1000 700 L0 700 Z" fill="#8d6e63"/>
  <path d="M0 585 C180 575 360 595 520 585 C700 575 820 595 1000 583 L1000 700 L0 700 Z" fill="#795548"/>
  <path d="M0 650 C220 642 380 660 540 650 C720 640 840 658 1000 648 L1000 700 L0 700 Z" fill="#6d4c41"/>

  <!-- Cámara magmática -->
  <ellipse cx="500" cy="625" rx="170" ry="52" fill="url(#camara)" stroke="#7a1410" stroke-width="3"/>

  <!-- Suelo con hierba -->
  <rect x="0" y="462" width="1000" height="10" fill="#6ab04c"/>

  <!-- Cono volcánico en capas (lava y ceniza alternas) -->
  <polygon points="240,470 440,150 560,150 760,470" fill="#7b5544"/>
  <polygon points="270,470 458,150 542,150 730,470" fill="#a07a62"/>
  <polygon points="300,470 476,150 524,150 700,470" fill="#6e4a3a"/>
  <polygon points="330,470 494,150 506,150 670,470" fill="#94705a"/>
  <polygon points="240,470 440,150 560,150 760,470" fill="none" stroke="#4e342e" stroke-width="3" stroke-linejoin="round"/>

  <!-- Cono secundario (salida lateral) -->
  <polygon points="636,271.6 693.9,288.8 684,348.4" fill="#7b5544" stroke="#4e342e" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="691" cy="290" rx="7" ry="4" fill="#ff7a1a" transform="rotate(16 691 290)"/>

  <!-- Conducto lateral -->
  <path d="M500 450 L690 292" stroke="url(#lava)" stroke-width="13" stroke-linecap="round" fill="none"/>
  <!-- Chimenea principal -->
  <rect x="488" y="172" width="24" height="420" rx="6" fill="url(#lava)"/>

  <!-- Cráter -->
  <path d="M440 150 Q500 205 560 150 Z" fill="url(#crater)" stroke="#4e342e" stroke-width="3" stroke-linejoin="round"/>

  <!-- Colada de lava por la ladera -->
  <path d="M446 152 C420 195 405 215 392 240 S360 300 340 330 S300 400 285 432" fill="none" stroke="#d63a16" stroke-width="18" stroke-linecap="round"/>
  <path d="M446 152 C420 195 405 215 392 240 S360 300 340 330 S300 400 285 432" fill="none" stroke="#ffb347" stroke-width="6" stroke-linecap="round"/>

  <!-- Nube de gases y cenizas -->
  <path d="M478 150 C470 130 462 120 455 105 L545 105 C538 120 530 130 522 150 Z" fill="#8e9599"/>
  <g fill="#9aa1a5" stroke="#6f777b" stroke-width="2">
    <circle cx="410" cy="108" r="24"/>
    <circle cx="600" cy="112" r="24"/>
    <circle cx="442" cy="92" r="36"/>
    <circle cx="568" cy="94" r="35"/>
    <circle cx="482" cy="66" r="42"/>
    <circle cx="530" cy="62" r="42"/>
    <circle cx="505" cy="100" r="36"/>
  </g>
  <g fill="#cfd4d6" opacity="0.7">
    <circle cx="470" cy="58" r="14"/>
    <circle cx="520" cy="48" r="12"/>
    <circle cx="560" cy="82" r="10"/>
  </g>
  <g fill="#555">
    <circle cx="380" cy="140" r="3"/><circle cx="395" cy="160" r="2.5"/>
    <circle cx="625" cy="140" r="3"/><circle cx="640" cy="162" r="2.5"/>
    <circle cx="610" cy="175" r="2"/><circle cx="372" cy="182" r="2"/>
  </g>
  <!-- humo del cono secundario -->
  <g fill="#b8bec1" opacity="0.85">
    <circle cx="700" cy="275" r="9"/>
    <circle cx="712" cy="260" r="11"/>
  </g>
</svg>
