<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity Web Player | Kartinged</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      #tap-overlay {
        position: fixed; inset: 0; z-index: 9999;
        background: linear-gradient(135deg, #1a1a2e, #0f3460);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        color: white; font-family: sans-serif;
        cursor: pointer; user-select: none; -webkit-user-select: none;
        touch-action: manipulation;
      }
      #tap-overlay .play-btn {
        width: 70px; height: 70px; border-radius: 50%;
        background: linear-gradient(135deg, #FF6B00, #FFD700);
        display: flex; align-items: center; justify-content: center;
        font-size: 2rem; margin-top: 28px;
        box-shadow: 0 0 40px rgba(255,107,0,0.7);
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Kartinged</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/kartinged.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/kartinged.data",
        frameworkUrl: buildUrl + "/kartinged.framework.js",
        codeUrl: buildUrl + "/kartinged.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Kartinged",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      function launchUnity() {
        if (isMobile) {
          document.querySelector("#unity-container").className = "unity-mobile";
          canvas.className = "unity-mobile";
        } else {
          canvas.style.width = "960px";
          canvas.style.height = "600px";
        }

        document.querySelector("#unity-loading-bar").style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
          }).then((unityInstance) => {
            document.querySelector("#unity-loading-bar").style.display = "none";
            document.querySelector("#unity-fullscreen-button").onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }).catch((message) => {
            alert(message);
          });
        };
        document.body.appendChild(script);
      }

      if (isMobile) {
        // Mostrar overlay ANTES de cargar Unity.
        // Así el AudioContext se crea dentro del gesto del usuario
        // y Unity nunca necesita mostrar su propio "Touch to play".
        var overlay = document.createElement('div');
        overlay.id = 'tap-overlay';
        overlay.innerHTML =
          '<div style="font-size:3.5rem;margin-bottom:16px">🏎️</div>' +
          '<div style="font-size:1.5rem;font-weight:900;' +
            'background:linear-gradient(90deg,#FF6B00,#FFD700);' +
            '-webkit-background-clip:text;-webkit-text-fill-color:transparent">' +
            'Toca para jugar</div>' +
          '<div style="font-size:0.85rem;opacity:0.55;margin-top:6px">Karting Educativo</div>' +
          '<div class="play-btn">▶</div>';
        document.body.appendChild(overlay);

        overlay.addEventListener('touchend', function(e) {
          e.preventDefault();
          overlay.remove();
          launchUnity();
        }, { once: true, passive: false });

        // Fallback para escritorio con touch simulado
        overlay.addEventListener('click', function() {
          overlay.remove();
          launchUnity();
        }, { once: true });

      } else {
        launchUnity();
      }
    </script>
  </body>
</html>
