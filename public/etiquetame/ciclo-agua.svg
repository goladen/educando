<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ecdf2"/>
      <stop offset="1" stop-color="#e3f4fd"/>
    </linearGradient>
    <linearGradient id="mar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b8fd4"/>
      <stop offset="1" stop-color="#1a4f8a"/>
    </linearGradient>
    <linearGradient id="tierra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cb35a"/>
      <stop offset="0.12" stop-color="#8d6e4f"/>
      <stop offset="1" stop-color="#6d4f37"/>
    </linearGradient>
    <marker id="fl" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ffffff"/>
    </marker>
    <marker id="flAzul" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#1f6fb8"/>
    </marker>
    <marker id="flGris" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#7b8a96"/>
    </marker>
    <g id="nube">
      <circle cx="-55" cy="10" r="34"/><circle cx="-15" cy="-14" r="44"/><circle cx="35" cy="-6" r="40"/><circle cx="70" cy="14" r="30"/>
      <rect x="-90" y="10" width="190" height="36" rx="18"/>
    </g>
  </defs>

  <!-- Cielo -->
  <rect width="1000" height="700" fill="url(#cielo)"/>

  <!-- Sol -->
  <g>
    <circle cx="80" cy="80" r="42" fill="#ffd54f" stroke="#f9a825" stroke-width="4"/>
    <g stroke="#f9a825" stroke-width="5" stroke-linecap="round">
      <line x1="80" y1="18" x2="80" y2="2"/><line x1="80" y1="142" x2="80" y2="158"/>
      <line x1="18" y1="80" x2="2" y2="80"/><line x1="142" y1="80" x2="158" y2="80"/>
      <line x1="36" y1="36" x2="25" y2="25"/><line x1="124" y1="124" x2="135" y2="135"/>
      <line x1="124" y1="36" x2="135" y2="25"/><line x1="36" y1="124" x2="25" y2="135"/>
    </g>
  </g>

  <!-- Tierra con montañas (corte) -->
  <path d="M400 490 C460 478 520 455 580 430 L650 360 L700 320 L760 225 L815 290 L870 250 L1000 330 L1000 700 L400 700 Z" fill="url(#tierra)"/>
  <path d="M742 254 L760 225 L778 252 L768 248 L760 256 L750 247 Z" fill="#ffffff"/>
  <path d="M858 262 L870 250 L885 260 L874 262 Z" fill="#ffffff"/>
  <!-- Capa de agua subterránea -->
  <path d="M400 610 C560 600 760 625 1000 612 L1000 655 C760 668 560 645 400 655 Z" fill="#4aa3df" opacity="0.75"/>
  <g stroke="#1f6fb8" stroke-width="3" fill="none" marker-end="url(#flAzul)">
    <path d="M900 632 L820 634"/><path d="M700 632 L620 628"/><path d="M520 628 L440 632"/>
  </g>

  <!-- Mar (acumulación) -->
  <path d="M0 480 L420 480 C410 560 405 640 400 700 L0 700 Z" fill="url(#mar)"/>
  <g fill="none" stroke="#9fd3f5" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M40 510 q15 -8 30 0 t30 0"/><path d="M180 540 q15 -8 30 0 t30 0"/><path d="M80 600 q15 -8 30 0 t30 0"/><path d="M260 620 q15 -8 30 0 t30 0"/><path d="M300 520 q15 -8 30 0 t30 0"/>
  </g>

  <!-- Río (escorrentía) -->
  <path d="M760 250 C735 295 705 330 690 370 S620 430 560 450 S470 478 418 486" fill="none" stroke="#2f80c9" stroke-width="12" stroke-linecap="round"/>
  <path d="M760 250 C735 295 705 330 690 370 S620 430 560 450 S470 478 418 486" fill="none" stroke="#8fd0f7" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 12"/>

  <!-- Árbol (transpiración) -->
  <rect x="510" y="405" width="14" height="40" fill="#6d4c41"/>
  <circle cx="517" cy="392" r="30" fill="#43a047" stroke="#2e7d32" stroke-width="3"/>
  <circle cx="497" cy="404" r="18" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="538" cy="404" r="18" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" marker-end="url(#fl)">
    <path d="M505 355 q-8 -15 0 -30 t0 -30"/>
    <path d="M530 355 q8 -15 0 -30 t0 -30"/>
  </g>

  <!-- Evaporación desde el mar -->
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" marker-end="url(#fl)">
    <path d="M150 465 q-12 -25 0 -50 t0 -50 t0 -50"/>
    <path d="M230 465 q-12 -25 0 -50 t0 -50 t0 -50 t0 -40"/>
    <path d="M310 465 q-12 -25 0 -50 t0 -50 t0 -50"/>
  </g>

  <!-- Nube de condensación -->
  <g fill="#ffffff" stroke="#c9d6df" stroke-width="2"><use href="#nube" transform="translate(290 150)"/></g>
  <!-- Viento lleva las nubes -->
  <path d="M410 150 C480 130 540 125 590 128" fill="none" stroke="#7b8a96" stroke-width="4" stroke-dasharray="12 9" marker-end="url(#flGris)"/>

  <!-- Nube de lluvia -->
  <g fill="#9aa8b4" stroke="#6f7f8c" stroke-width="2"><use href="#nube" transform="translate(700 120) scale(1.05)"/></g>
  <!-- Precipitación -->
  <g stroke="#2f80c9" stroke-width="4" stroke-linecap="round">
    <line x1="630" y1="185" x2="620" y2="215"/><line x1="660" y1="190" x2="650" y2="220"/><line x1="690" y1="188" x2="680" y2="218"/>
    <line x1="720" y1="190" x2="710" y2="220"/><line x1="750" y1="186" x2="740" y2="216"/><line x1="780" y1="188" x2="770" y2="218"/>
    <line x1="640" y1="235" x2="630" y2="265"/><line x1="670" y1="240" x2="660" y2="270"/><line x1="700" y1="236" x2="690" y2="266"/>
    <line x1="730" y1="240" x2="720" y2="270"/><line x1="610" y1="240" x2="600" y2="270"/>
    <line x1="625" y1="290" x2="615" y2="320"/><line x1="655" y1="292" x2="645" y2="322"/>
  </g>

  <!-- Infiltración -->
  <g fill="none" stroke="#1f6fb8" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#flAzul)">
    <path d="M840 320 L840 585"/>
    <path d="M900 320 L900 585"/>
    <path d="M960 340 L960 585"/>
  </g>
</svg>
