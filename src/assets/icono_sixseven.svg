<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Logo de Six Seven: un 6 rosa y un 7 cian en neón (colores del juego) -->
  <defs>
    <radialGradient id="fondo" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="0.8" stop-color="#09090E"/>
    </radialGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#fondo)"/>
  <rect x="6" y="6" width="188" height="188" rx="40" fill="none" stroke="#B026FF" stroke-opacity="0.35" stroke-width="3"/>
  <text x="66" y="142" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="118"
        fill="none" stroke="#FF007F" stroke-width="7" stroke-linejoin="round" filter="url(#neon)" transform="rotate(-8 66 100)">6</text>
  <text x="134" y="150" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="118"
        fill="none" stroke="#00F0FF" stroke-width="7" stroke-linejoin="round" filter="url(#neon)" transform="rotate(8 134 100)">7</text>
</svg>
